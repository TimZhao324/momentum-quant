<!doctype html>
<!--
  Quantitative Equity Research Dashboard
  Renders performance payloads from data/{overview,alpha,factors,server}.json
  and chart artifacts from charts/. Self-contained zero-dependency frontend.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-Sectional Momentum in US Large Caps</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --line: #26304a;
    --text: #e7ecf5;
    --muted: #8b96ad;
    --accent: #4ea1ff;
    --gray: #7a869c;
    --good: #39d98a;
    --warn: #e6b23a;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 24px; margin: 0 0 6px; line-height: 1.3; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 12px; }
  .warn-banner {
    background: rgba(230, 178, 58, 0.08);
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin: 16px 0 22px;
  }
  nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  nav button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 10px 18px;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-weight: 500;
  }
  nav button.on {
    color: var(--text);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }
  nav button:hover { color: var(--text); }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 15px;
  }
  .card .k {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 5px; }
  .card .b { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 22px;
  }
  .panel h2 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
  .panel .lede { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  figure { margin: 0; }
  figure img { width: 100%; height: auto; display: block; border-radius: 7px; }
  figcaption { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.55; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: right;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  tbody tr:last-child td { border-bottom: none; }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }
  .dim { color: var(--muted); }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--muted);
    color: var(--muted);
  }
  .pill.significant { color: var(--good); border-color: var(--good); }
  .pill.noise { color: var(--muted); border-color: var(--line); }
  .legend {
    display: flex;
    gap: 18px;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .finding {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 16px;
    margin: 16px 0;
  }
  .finding b { color: var(--text); }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 12px; line-height: 1.6; }
  pre {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 14px;
    overflow-x: auto;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0;
  }
  footer {
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--line);
    margin-top: 40px;
    padding-top: 18px;
  }
  .err { color: var(--bad); }
  @media (max-width: 600px) { .cards { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Does 12-Month Momentum Pick Stocks — or Just Pick Beta?</h1>
  <div class="sub" id="sub">Loading analytics payload...</div>
  <div class="warn-banner">
    Methodological Note: Universe reflects current S&amp;P-100 constituents backfilled to 2015 (subject to survivorship bias). Benchmark risk-free rate assumed zero. Paper trading simulation only.
  </div>
  <nav id="nav"></nav>
  <div id="view"></div>
  <footer id="foot"></footer>
</div>

<script>
const pct = (x, d = 2) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const num = (x, d = 2) => x == null ? "—" : x.toFixed(d);
const sign = (x, d = 2) => x == null ? "—" : (x >= 0 ? "+" : "") + x.toFixed(d);
const cls = x => x == null ? "" : x >= 0 ? "pos" : "neg";
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const card = (k, v, b, c) =>
  `<div class="card"><div class="k">${k}</div>
   <div class="v ${c || ""}">${v}</div><div class="b">${b || ""}</div></div>`;

const figure = (src, caption) =>
  `<figure><img src="charts/${src}.png" alt="${src}" loading="lazy">
   <figcaption>${caption}</figcaption></figure>`;

function table(headers, rows) {
  return `<div class="scroll"><table><thead><tr>${
    headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")
  }</tbody></table></div>`;
}

function lineChart(series, opts) {
  const W = 1000, H = 300, L = 52, R = 12, T = 14, B = 26;
  const all = series.flatMap(s => s.values);
  const lo = Math.log(Math.min(...all)), hi = Math.log(Math.max(...all));
  const n = series[0].values.length;
  const X = i => L + (W - L - R) * (n === 1 ? 0 : i / (n - 1));
  const Y = v => T + (H - T - B) * (1 - (Math.log(v) - lo) / (hi - lo || 1));

  let grid = "", ticks = [0.5, 1, 2, 5, 10, 20].filter(t => t >= Math.min(...all) * 0.85 && t <= Math.max(...all) * 1.15);
  ticks.forEach(t => {
    grid += `<line x1="${L}" y1="${Y(t)}" x2="${W - R}" y2="${Y(t)}" stroke="#26304a" stroke-width="1"/>
             <text x="${L - 8}" y="${Y(t) + 4}" fill="#8b96ad" font-size="12" text-anchor="end">$${t}</text>`;
  });
  opts.labels.forEach((lab, i) => {
    if (i % 24 === 0 || i === n - 1) {
      grid += `<text x="${X(i)}" y="${H - 6}" fill="#8b96ad" font-size="12" text-anchor="middle">${lab.slice(0, 4)}</text>`;
    }
  });
  const paths = series.map(s =>
    `<path d="${s.values.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ")}"
       fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round"/>`).join("");
  return `<div class="legend">${series.map(s =>
      `<span><span class="dot" style="background:${s.color}"></span>${s.name}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="growth of one dollar">
      ${grid}${paths}</svg>`;
}

const TABS = [
  ["overview", "Overview", "overview"],
  ["alpha", "Alpha & IC Diagnostics", "alpha"],
  ["factors", "Factor Attribution", "factors"],
];

const RENDER = {
  overview(d) {
    const h = d.headline;
    return `
    <div class="cards">
      ${card("Information Ratio", num(h.portfolio_ir), `vs SPY (t = ${num(h.ir_t)})`, "pos")}
      ${card("Signal Rank IC", sign(h.signal_ic, 4), `t = ${sign(h.signal_t)} (noise)`, "dim")}
      ${card("Long-Only Sharpe", num(h.lo_sharpe), `beta ${num(h.lo_beta)} · SPY: ${num(h.spy_sharpe)}`)}
      ${card("Long-Short Sharpe", num(h.ls_sharpe), `beta ${num(h.ls_beta)} (neutral)`)}
      ${card("$1 Terminal NAV", "$" + num(h.lo_nav), `SPY $${num(h.spy_nav)} · L/S $${num(h.ls_nav)}`, "pos")}
      ${card("Max Drawdown", pct(h.lo_mdd, 1), "long-only book", "neg")}
    </div>

    <div class="panel">
      <h2>Empirical Finding Summary</h2>
      <div class="finding">
        The unhedged long-only portfolio compounded $1 into <b>$${num(h.lo_nav)}</b> (Sharpe <b>${num(h.lo_sharpe)}</b>, CAGR <b>${pct(h.lo_cagr)}</b>) against SPY's $${num(h.spy_nav)}.
        However, cross-sectional predictive power is statistically negligible: <b>Rank IC = ${sign(h.signal_ic, 4)} (t = ${sign(h.signal_t)})</b>.
        When market beta is neutralized in the dollar-neutral implementation, returns contract to <b>${pct(h.ls_cagr)}/yr</b> (Sharpe <b>${num(h.ls_sharpe)}</b>).
        The apparent outperformance is driven by equity market beta (${num(h.lo_beta)}) and growth style tilts rather than stock selection skill.
      </div>
      <div class="note">
        The primary statistically defensible metric is the <b>Portfolio Information Ratio of ${num(h.portfolio_ir)}</b>
        (active return ${pct(h.active_return)}/yr vs tracking error ${pct(h.tracking_error)}, t = ${num(h.ir_t)}), subject to constituent survivorship constraints.
      </div>
    </div>

    <div class="panel">
      <h2>Cumulative NAV Growth (Log Scale)</h2>
      <p class="lede">${d.window.months} months, ${d.window.start} → ${d.window.end}, net of ${"10"} bps turnover friction.</p>
      ${lineChart([
        { name: "Long-only Top 10", color: "#4ea1ff", values: d.nav_curve.map(r => r.long_only) },
        { name: "Long-short Deciles", color: "#39d98a", values: d.nav_curve.map(r => r.long_short) },
        { name: "SPY Benchmark", color: "#7a869c", values: d.nav_curve.map(r => r.spy) },
      ], { labels: d.nav_curve.map(r => r.date) })}
      <div class="note">Logarithmic scaling reflects constant percentage growth rates. The green series represents the dollar-neutral spread portfolio with market beta removed.</div>
    </div>

    <div class="panel">
      <h2>Market Beta Attribution (Unhedged vs Dollar-Neutral)</h2>
      ${figure("03_scatter", `Monthly return scatter against SPY. Fitted slope represents market beta: ${num(h.lo_beta)} for long-only (left) versus ${num(h.ls_beta)} for dollar-neutral (right). Dollar-neutral deciles effectively eliminate systematic market exposure.`)}
    </div>

    <div class="panel">
      <h2>Drawdown Trajectory &amp; Portfolio Turnover</h2>
      ${figure("03_drawdown", `Underwater drawdown trajectory for the long-only portfolio. Maximum peak-to-trough decline: ${pct(h.lo_mdd, 1)}.`)}
      <div style="height:16px"></div>
      ${figure("03_turnover", `Monthly portfolio turnover averaging ${num(h.lo_turnover)} per period, resulting in annualized friction drag of ${num(h.lo_cost_bps, 0)} bps.`)}
    </div>

    <div class="panel">
      <h2>Cross-Signal Performance Comparison</h2>
      <p class="lede">Uniform simulation engine, transaction cost model, and dual execution regimes across 6 equity strategies.</p>
      ${table(["Signal ID", "Sleeve", "LO Sharpe", "LO CAGR", "LO maxDD", "LO Beta", "LS Sharpe", "LS CAGR", "LS Beta", "Turnover"],
        d.strategies.map(s => [
          esc(s.name), `<span class="dim">${esc(s.sleeve)}</span>`,
          `<span class="${cls(s.lo_sharpe)}">${num(s.lo_sharpe)}</span>`, pct(s.lo_cagr, 1),
          `<span class="neg">${pct(s.lo_mdd, 1)}</span>`, num(s.lo_beta),
          `<span class="${cls(s.ls_sharpe)}">${num(s.ls_sharpe)}</span>`, pct(s.ls_cagr, 1),
          num(s.ls_beta), num(s.turnover),
        ]))}
      <div class="note">Notice the compression across all dollar-neutral Sharpe ratios. Hedging systematic factor exposure isolates residual signal efficacy.</div>
    </div>`;
  },

  alpha(d) {
    const q = d.quintiles, ir = d.ir_names, pr = d.pearson_vs_rank, g = d.grinold;
    return `
    <div class="panel">
      <h2>Cross-Sectional Information Coefficient (IC)</h2>
      <p class="lede">Monthly rank correlation between period-t predictive signal scores and period-(t+1) realized forward returns.</p>
      ${table(["Signal ID", "Sleeve", "Mean IC", "IC Std", "Signal IR", "t-Stat", "p-Value", "Hit Rate", "Verdict"],
        d.ic_table.map(r => [
          esc(r.name), `<span class="dim">${esc(r.sleeve)}</span>`,
          `<span class="${cls(r.ic_mean)}">${sign(r.ic_mean, 4)}</span>`, num(r.ic_std, 3),
          sign(r.signal_ir, 3), `<b>${sign(r.t)}</b>`, num(r.p, 3), pct(r.hit_rate, 1),
          `<span class="pill ${r.verdict}">${r.verdict}</span>`,
        ]))}
      <div class="note">The threshold for statistical significance is |t| &gt; 2.0. Only High Volatility 6M clears this boundary, contradicting the traditional low-volatility anomaly.</div>
    </div>

    <div class="panel">
      <h2>Rank IC vs Parametric Pearson IC</h2>
      <div class="cards">
        ${card("Pearson IC", sign(pr.pearson, 4), "Parametric (size-weighted)")}
        ${card("Rank IC", sign(pr.rank, 4), "Non-parametric (order only)")}
        ${card("Ratio Gap", num(pr.ratio, 1) + "×", "Disparity from return outliers")}
      </div>
      <div class="note">Pearson correlation is vulnerable to tail outliers (e.g. +40% monthly single-stock shocks). Spearman Rank IC evaluates ordinal ranking accuracy, which governs actual portfolio weight construction.</div>
    </div>

    <div class="panel">
      <h2>Monthly Information Coefficient Trajectory</h2>
      ${figure("04_ic_series", `Monthly cross-sectional Rank IC for Momentum 12-1. Green bars indicate positive predictive ranking; red indicates negative. Mean IC sits at ${sign(d.ic_table[0].ic_mean, 4)} (statistically indistinguishable from zero).`)}
      <div style="height:16px"></div>
      ${figure("04_ic_cumulative", `Cumulative Rank IC trajectories. True alpha accumulates systematically, whereas noise oscillates around zero.`)}
    </div>

    <div class="panel">
      <h2>Quantile Return Monotonicity</h2>
      ${figure("04_quintiles", `Forward returns partitioned by score quintile. Theoretical validity requires monotonic descent (Q1 highest, Q5 lowest). Here, Q5 outperforms Q2, Q3, and Q4, confirming non-monotonicity. Q1−Q5 annualized spread: ${num(q.spread_annual_pct, 2)}%/yr (t = ${num(q.spread_t)}).`)}
    </div>

    <div class="panel">
      <h2>Signal IR vs Portfolio IR Distinction</h2>
      ${table(["Metric", "Mathematical Definition", "Observed Value", "Analytical Focus"], [
        ["<b>Signal IR</b>", "mean(IC) / std(IC)", `<b>${sign(ir.signal_ir, 3)}</b>`, "Forecast accuracy and ranking consistency over time"],
        ["<b>Portfolio IR</b>", "active return / tracking error", `<b class="pos">${num(ir.portfolio_ir)}</b>`, "Realized active return per unit of benchmark tracking deviation"],
      ])}
      <div class="note">Portfolio Information Ratio reflects benchmark outperformance relative to tracking error (${pct(ir.active_return)} active return over ${pct(ir.tracking_error)} tracking error). Signal IR evaluates underlying ranking stability.</div>
    </div>

    <div class="panel">
      <h2>Fundamental Law of Active Management Cross-Check</h2>
      <div class="cards">
        ${card("Decision Breadth", g.breadth, "≈100 assets × 12 periods/yr")}
        ${card("Predicted IR", num(g.predicted_ir), "Grinold formula (IC × √BR)")}
        ${card("Measured Sharpe", num(g.measured_sharpe), "Empirical dollar-neutral Sharpe")}
      </div>
      <div class="note">Grinold's theoretical relation (Predicted IR ≈ 0.28) converges closely with measured dollar-neutral backtest Sharpe (0.29), providing cross-methodological validation.</div>
    </div>`;
  },

  factors(d) {
    const p = d.parameterisation;
    const fitRows = fit => fit.names.map((n, i) => [
      n === "ALPHA" ? "<b>ALPHA</b> <span class=\"dim\">(Annualized)</span>" : n,
      n === "ALPHA"
        ? `<span class="${cls(fit.alpha_annual)}">${pct(fit.alpha_annual)}</span>`
        : num(fit.beta[i], 3),
      n === "ALPHA" ? pct(fit.alpha_se_annual) : num(fit.se[i], 3),
      `<b class="${Math.abs(fit.t[i]) > 2 ? "pos" : "dim"}">${sign(fit.t[i])}</b>`,
      num(fit.p[i], 3),
    ]);
    return `
    <div class="panel">
      <h2>Multi-Factor Linear Regression Decomposition</h2>
      <p class="lede">R = α + β₁·MKT + β₂·GROWTH + β₃·SIZE + β₄·RATES + β₅·GOLD + β₆·USD + ε (OLS analytical solution). Alpha represents unexplained residual variance.</p>

      <h2 style="margin-top:18px;font-size:14px">Long-Only Model &nbsp;<span class="dim">R² = ${num(d.long_only.r2, 3)}</span></h2>
      ${table(["Factor", "Loading (β)", "Std Error", "t-Stat", "p-Value"], fitRows(d.long_only))}

      <h2 style="margin-top:22px;font-size:14px">Dollar-Neutral Model &nbsp;<span class="dim">R² = ${num(d.long_short.r2, 3)}</span></h2>
      ${table(["Factor", "Loading (β)", "Std Error", "t-Stat", "p-Value"], fitRows(d.long_short))}

      <div class="finding" style="margin-top:18px">
        Long-only portfolio variance exhibits R² = ${num(d.long_only.r2, 2)}, with two-thirds attributable to systematic factor risks (market beta ${num(d.long_only.beta[1], 2)}).
        The dollar-neutral portfolio isolates market beta (β = ${num(d.long_short.beta[1], 2)}), but retains significant growth factor exposure: <b>β_GROWTH = ${num(d.long_short.beta[2], 2)} (t = ${num(d.long_short.t[2], 1)})</b>.
        Annualized alpha of ${pct(d.long_short.alpha_annual)}/yr (t = ${num(d.long_short.t[0])}) is statistically indistinguishable from zero.
      </div>
      ${figure("05_betas", "Factor beta loadings with 95% confidence interval error bars. Intervals overlapping zero denote exposures that cannot be distinguished from random noise.")}
    </div>

    <div class="panel">
      <h2>Orthogonalized Spread Factors vs Raw ETF Regressors</h2>
      <p class="lede">SPY, QQQ, and IWM exhibit mutual correlations of ~0.90. Regressing against raw ETFs produces severe multicollinearity. Orthogonalized style spreads (QQQ−SPY, IWM−SPY) stabilize parameter estimates.</p>
      ${table(["Model Specification", "R²", "Annual Alpha", "Market Beta", "Beta Std Error", "Diagnostic Status"], [
        ["Raw ETFs (SPY / QQQ / IWM)", num(p.raw.r2, 4), pct(p.raw.alpha_annual),
          num(p.raw.market_beta, 3), `<span class="neg">${num(p.raw.market_se, 3)}</span>`,
          `<span class="dim">Collinear / Unstable</span>`],
        ["Spread Factors (MKT / GROWTH / SIZE)", num(p.spread.r2, 4), pct(p.spread.alpha_annual),
          num(p.spread.market_beta, 3), `<span class="pos">${num(p.spread.market_se, 3)}</span>`,
          `<span class="pos">${num(p.se_ratio, 1)}× Tighter SE</span>`],
      ])}
      <div class="note">
        <b>R² and alpha are mathematically identical</b> because the spread formulation spans the identical linear subspace. However, orthogonalizing the basis vectors reduces standard error by ${num(p.se_ratio, 1)}× and eliminates estimator inflation.
      </div>
      <div style="height:18px"></div>
      ${table(["Variance Inflation Factor (VIF)", ...Object.keys(d.vif.raw)], [
        ["Raw ETF Regressors", ...Object.values(d.vif.raw).map(v => `<span class="neg">${num(v, 1)}</span>`)],
        ["Spread Regressors", ...Object.values(d.vif.spread).map(v => `<span class="pos">${num(v, 2)}</span>`)],
      ])}
      <div class="note">VIF values exceeding 5.0 indicate problematic multicollinearity. All production factors maintain VIF below ${num(Math.max(...Object.values(d.vif.six)), 2)}.</div>
    </div>

    <div class="panel">
      <h2>Fitted Returns &amp; Residual Diagnostic</h2>
      ${figure("05_fit", "Predicted vs realized monthly returns across long-only and dollar-neutral regimes. Scatter along the 45-degree diagonal reflects explanatory fit.")}
      <div style="height:16px"></div>
      ${figure("05_residuals", "Regression residuals over time, confirming that unexplained variance behaves as structureless white noise.")}
    </div>`;
  },
};

const cache = {};
let active = TABS[0][0];

async function load(name) {
  if (!cache[name]) {
    const res = await fetch(`data/${name}.json`, { cache: "no-store" });
    if (!res.ok) throw new Error(`data/${name}.json: ${res.status}`);
    cache[name] = await res.json();
  }
  return cache[name];
}

async function go(id) {
  active = id;
  document.querySelectorAll("#nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.id === id));
  const view = document.getElementById("view");
  try {
    const tab = TABS.find(t => t[0] === id);
    view.innerHTML = RENDER[id](await load(tab[2]));
  } catch (e) {
    view.innerHTML = `<div class="panel err">Failed to load analytics: ${esc(e.message)}
      <div class="note">Ensure <b>tools/pipeline.py</b> has executed and serve page over HTTP (via <b>tools/serve.py</b>).</div>
      </div>`;
  }
}

(async function start() {
  document.getElementById("nav").innerHTML = TABS.map(([id, label]) =>
    `<button data-id="${id}" onclick="go('${id}')">${label}</button>`).join("");
  try {
    const d = await load("overview");
    document.getElementById("sub").textContent =
      `${d.window.universe} Large-Cap Constituent Equities · ${d.window.months} Months (${d.window.start} → ${d.window.end}) · Compiled: ${d.generated_at}`;
    try {
      const s = await load("server");
      document.getElementById("foot").innerHTML =
